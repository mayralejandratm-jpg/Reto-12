<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para dar volumen -->
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#sombra)">
    <!-- Silueta elegante de Guitarra (Fondo Gris Claro) -->
    <path d="M 180 40 Q 220 20 280 30 Q 320 40 370 25 L 390 28 Q 330 50 290 42 Q 230 35 180 50 Z" fill="#C0C0C0" opacity="0.8"/>
    <rect x="165" y="38" width="18" height="10" rx="2" fill="#A0A0A0" transform="rotate(-12 165 38)"/>
    
    <!-- Texto "Vibr" en Naranja -->
    <text x="30" y="105" font-family="'Retrograde Regular', Georgia, serif" font-size="82" font-weight="bold" fill="#FF7723">Vibr</text>
    
    <!-- Texto "arte" en Negro -->
    <text x="235" y="105" font-family="'Retrograde Regular', Georgia, serif" font-size="82" font-weight="bold" fill="#000000">arte</text>

    <!-- Clave de Sol estilizada (Azul Teal) sobre la 'i' -->
    <path d="M 105 15 C 120 30 135 60 115 85 C 100 105 85 80 98 65 C 108 55 125 70 110 95 C 100 110 88 125 102 135 C 112 140 120 130 115 120 C 108 105 80 120 95 70 C 102 45 100 25 105 15 Z" fill="#1B9A91"/>
    
    <!-- Eslogan inferior en fuente limpia -->
    <text x="50" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#000000" letter-spacing="4">DONDE LA MÚSICA COBRA VIDA</text>
  </g>
</svg>
